name: Security tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: visitor_registration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U test_user -d visitor_registration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -v --junitxml=security-test-results.xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test_user:test_only_password@localhost:${{ job.services.postgres.ports[5432] }}/visitor_registration_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: security-test-results.xml
